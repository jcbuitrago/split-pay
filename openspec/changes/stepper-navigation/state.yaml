decisions:
  - id: paso-1-sin-foto
    closed: 2026-10-27
    question: Que ve el usuario al volver al paso 1, donde ya no hay foto.
    answer: >
      Zona de drag & drop normal MAS un aviso que explique que la foto no se guarda por
      seguridad, que los items siguen ahi y que puede continuar o escanear de nuevo.
    rationale: >
      No revierte la mitigacion de SET_STEP (BillContext.tsx:48) y evita que el usuario
      crea que la app perdio su trabajo.
    rejected:
      - Zona vacia sin aviso - el usuario que volvio a proposito cree que perdio los datos.
      - Conservar originalImage en memoria - revierte una mitigacion de seguridad intencional.
  - id: accesibilidad-del-circulo
    closed: 2026-10-27
    question: Requisitos de accesibilidad al convertir el div en boton.
    answer: >
      button real (no div con role), aria-current="step" en el paso activo, aria-label
      descriptivo por paso, disabled real en los no navegables y anillo de foco visible.
    rationale: Decision tecnica estandar, no de producto. Fijada por el orquestador.
  - id: color-del-anillo-de-foco
    closed: 2026-10-27
    question: Que token de color usar para el anillo de foco del circulo.
    answer: >
      Anillo de --color-white con un gap de 2px de --color-darkest, apilado en el mismo
      boxShadow que el glow del paso activo.
    rationale: >
      --glow-purple-ring se implemento primero y se descarto tras MIRARLO en el navegador:
      es morado al 25% y resulta invisible sobre un circulo ya morado. El blanco mide
      17,74:1 contra el fondo y 5,37:1 contra el circulo; WCAG 2.4.11 pide 3:1.
      Ambas variables ya existian en src/theme.css.
    rejected:
      - --glow-purple-ring - invisible sobre el circulo morado, verificado en pantalla.
      - --color-gold - el dorado ya significa "asignado" en PersonAvatar; reusarlo para
        foco mezclaria dos significados distintos.

